{% extends "base.html" %}
{% block title %}Minhas Tarefas{% endblock %}
{% block content %}

<div class="alert alert-info d-flex align-items-center gap-2">
  <i class="bi bi-quote fs-4"></i>
  <span>{{ frase }}</span>
</div>

<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
  <h3 class="mb-0"><i class="bi bi-list-task"></i> Minhas Tarefas</h3>
  <div class="d-flex gap-2">
    <select id="filtro-status" class="form-select">
      <option value="" {{ "selected" if status_filtro == "" }}>Todos os status</option>
      <option value="pendente" {{ "selected" if status_filtro == "pendente" }}>Pendente</option>
      <option value="em_andamento" {{ "selected" if status_filtro == "em_andamento" }}>Em andamento</option>
      <option value="concluida" {{ "selected" if status_filtro == "concluida" }}>Concluída</option>
    </select>
    <a href="{{ url_for('nova_tarefa') }}" class="btn btn-success text-nowrap">
      <i class="bi bi-plus-circle"></i> Nova Tarefa
    </a>
  </div>
</div>

<div id="lista-tarefas" class="row g-3">
  {% include "_tarefas_lista.html" %}
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/tarefas.js') }}"></script>
{% endblock %}
